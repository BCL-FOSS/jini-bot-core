services:
  backend:
    restart: always
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    environment:
      - CLIENT_AUTH_DB=${CLIENT_AUTH_DB}
      - CLIENT_AUTH_DB_PORT=${CLIENT_AUTH_DB_PORT}
      - CLIENT_SESS_DB=${CLIENT_SESS_DB}
      - CLIENT_SESS_DB_PORT=${CLIENT_SESS_DB_PORT}
      - CLIENT_DATA_DB=${CLIENT_DATA_DB}
      - CLIENT_DATA_DB_PORT=${CLIENT_DATA_DB_PORT}
      - IP_BAN_DB=${IP_BAN_DB}
      - IP_BAN_DB_PORT=${IP_BAN_DB_PORT}
      - RATE_LIMIT_DB=${RATE_LIMIT_DB}
      - RATE_LIMIT_DB_PORT=${RATE_LIMIT_DB_PORT}
      - SERVER_NAME=${SERVER_NAME}
      - OLLAMA_PROXY_URL=${OLLAMA_PROXY_URL}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT}
      - API_TOKEN_NAME=${API_TOKEN_NAME}
      - OTS_USER=${OTS_USER}
      - OTS_KEY=${OTS_KEY}
      - OTS_TTL=${OTS_TTL}
      - REGION=${OTS_REGION} 
      - MAX_AUTH_ATTEMPTS=${MAX_AUTH_ATTEMPTS}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - API_NAME=${API_NAME}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - JIRA_CLOUD_ID=${JIRA_CLOUD_ID}
      - JIRA_AUTH_TOKEN=${JIRA_AUTH_TOKEN}
      - JIRA_AUTH_EMAIL=${JIRA_AUTH_EMAIL}
    
  frontend:
    restart: always
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend
    environment:
      - CLIENT_AUTH_DB=${CLIENT_AUTH_DB}
      - CLIENT_AUTH_DB_PORT=${CLIENT_AUTH_DB_PORT}
      - CLIENT_SESS_DB=${CLIENT_SESS_DB}
      - CLIENT_SESS_DB_PORT=${CLIENT_SESS_DB_PORT}
      - CLIENT_DATA_DB=${CLIENT_DATA_DB}
      - CLIENT_DATA_DB_PORT=${CLIENT_DATA_DB_PORT}
      - IP_BAN_DB=${IP_BAN_DB}
      - IP_BAN_DB_PORT=${IP_BAN_DB_PORT}
      - SERVER_NAME=${SERVER_NAME}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT}
      - API_TOKEN_NAME=${API_TOKEN_NAME}
      - MAX_AUTH_ATTEMPTS=${MAX_AUTH_ATTEMPTS}
      - API_NAME=${API_NAME}

  jini:
    restart: always
    build:
      context: .
      dockerfile: backend/ai/Dockerfile
    container_name: jini
    volumes:
      - smartbot_data:/home/quart
    environment:
      - CLIENT_DATA_DB=${CLIENT_DATA_DB}
      - CLIENT_DATA_DB_PORT=${CLIENT_DATA_DB_PORT}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - SERVER_NAME=${SERVER_NAME}
      - API_NAME=${API_NAME}
      
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama_models:/root/.ollama 

  rate_limit_redis:
    image: redis:latest
    container_name: ${RATE_LIMIT_DB}
    command: ["redis-server", "--port", "9379", "--appendonly", "yes"]
    volumes:
      - rate_limit_data:/data 

  client_sess_redis:
    image: redis:latest
    container_name: ${CLIENT_SESS_DB}
    command: ["redis-server", "--port", "8369", "--appendonly", "yes"]
    volumes:
      - client_sess_data:/data

  client_auth_redis:
    image: redis:latest
    container_name: ${CLIENT_AUTH_DB}
    command: ["redis-server", "--port", "7369", "--appendonly", "yes"]
    volumes:
      - client_auth_data:/data 

  client_data_redis:
    image: redis:latest
    container_name: ${CLIENT_DATA_DB}
    command: ["redis-server", "--port", "6369", "--appendonly", "yes"]
    volumes:
      - client_data:/data

  ip_ban_redis:
    image: redis:latest
    container_name: ${IP_BAN_DB}
    command: ["redis-server", "--port", "5379", "--appendonly", "yes"]
    volumes:
      - ip_ban_data:/data

  caddy:
    build:
      context: .
      dockerfile: waf/Dockerfile.caddy
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./waf/Caddyfile.owasp2:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  ip_ban_data:
    external: true
  smartbot_data:
    external: true
  ollama_models:
    external: true
  client_data:
    external: true
  client_sess_data:
    external: true
  client_auth_data:
    external: true
  rate_limit_data:
    external: true
  caddy_data:
    external: true
  caddy_config:
    external: true